name: Scan

# Daily: scan the linux/arm64 build of every image in the published library with Grype, read the
# macOS and container-kernel advisories (tools/platform_report.py), build report.json from both, sign it with the report key, and commit report.json and
# report.json.sig to the `published` branch. Flotilla shows the findings and acts on nothing.
# (DECISIONS Q62.) Never touches library.json, library.json.sig or icons/, and never uses the
# library key: that one is in the owner's Keychain and no workflow has it.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One at a time, so two runs can't race to push; a manual run waits for the scheduled one.
concurrency:
  group: scan
  cancel-in-progress: false

env:
  # Grype is downloaded from Anchore's GitHub release and checked against this SHA-256, taken from
  # the release's grype_0.120.1_checksums.txt. To move to a new version change all three together.
  GRYPE_VERSION: "0.120.1"
  GRYPE_LINUX_AMD64_SHA256: "0a9ee97ef5ae2ee953b0a80098105052e846cdbe319a57d808b519c33cd1343d"
  GRYPE_CHECK_FOR_APP_UPDATE: "false"
  # Per attempt, so one stuck pull can't eat the job. Images that are several GB get the longer one
  # (a case pattern, matched against the image reference).
  SCAN_TIMEOUT: "20m"
  SCAN_TIMEOUT_LARGE: "40m"
  LARGE_IMAGES: "quay.io/jupyter/*"
  # gdmf.apple.com's chain ends in Apple Root CA, which isn't in Ubuntu's bundle. tools/apple-root-ca.pem
  # is that certificate (from https://www.apple.com/appleca/); this is the SHA-256 of its DER form.
  APPLE_ROOT_CA_SHA256: "b0b1730ecbc7ff4505142c49f1295e6eda6bcaed7e2c68c5be91b5a11001f024"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # No secrets here, and no write access: this job only talks to registries.
    permissions:
      contents: read
    steps:
      # Grype unpacks a registry image's layers to disk, and a multi-GB image overflows the runner's
      # root disk. Drop toolchains this job never uses, then send Grype's temp files and database to
      # whichever of / and /mnt has more room. (First, so nothing below has written much yet.)
      - name: Free disk space and choose Grype's scratch disk
        run: |
          set -eu
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          best=/
          if [ "$(df --output=avail -k /mnt | tail -1)" -gt "$(df --output=avail -k / | tail -1)" ]; then best=/mnt; fi
          scratch="${best%/}/grype-scratch"
          sudo mkdir -p "$scratch"
          sudo chown "$(id -u):$(id -g)" "$scratch"
          mkdir -p "$scratch/tmp" "$scratch/cache"
          echo "TMPDIR=$scratch/tmp" >> "$GITHUB_ENV"
          echo "GRYPE_DB_CACHE_DIR=$scratch/cache" >> "$GITHUB_ENV"
          echo "Grype scratch: $scratch"
          df -h / /mnt

      - name: Check out the tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main
          persist-credentials: false

      - name: Check out the published library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: published
          path: published
          persist-credentials: false

      - name: Install Grype (pinned, checksum-verified)
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/grype-dl" "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/grype-dl"
          archive="grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/${archive}"
          echo "${GRYPE_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" grype
          "$RUNNER_TEMP/bin/grype" version

      - name: Update Grype's vulnerability database
        run: |
          "$RUNNER_TEMP/bin/grype" db update
          "$RUNNER_TEMP/bin/grype" db status

      # Each image once, as linux/arm64 (what a Mac running `container` pulls). Grype reads the
      # registry itself; nothing is run. One image failing doesn't stop the others; it is left out
      # of the report, and the job fails at the end so it is seen.
      - name: Scan every image in library.json
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/scans"
          python3 main/tools/build_report.py images published/library.json > "$RUNNER_TEMP/images.txt"
          echo "$(wc -l < "$RUNNER_TEMP/images.txt") images"
          failed=0
          n=0
          while IFS= read -r image; do
            n=$((n + 1))
            out="$RUNNER_TEMP/scans/$(printf '%03d' "$n").json"
            ok=0
            limit="$SCAN_TIMEOUT"
            case "$image" in $LARGE_IMAGES) limit="$SCAN_TIMEOUT_LARGE" ;; esac
            for attempt in 1 2 3; do
              err="$RUNNER_TEMP/grype.err"
              rc=0
              timeout "$limit" "$RUNNER_TEMP/bin/grype" "registry:$image" --platform linux/arm64 \
                --output json --quiet --file "$out" 2> "$err" || rc=$?
              if [ "$rc" = 0 ]; then ok=1; break; fi
              echo "attempt $attempt failed for $image (exit $rc, limit $limit; 124 = timed out)" >&2
              # Grype's own error, last 20 lines. This job holds no secrets; still, cut each line
              # short and defuse anything that looks like a workflow command.
              tail -n 20 "$err" | cut -c1-400 | sed 's/^::/ ::/' | sed 's/^/  grype: /' >&2
              df -h "$TMPDIR" | tail -n 1 | sed 's/^/  disk: /' >&2
              rm -rf "${TMPDIR:?}"/* 2>/dev/null || true
              sleep 15
            done
            if [ "$ok" = 0 ]; then echo "::error::could not scan $image"; rm -f "$out"; failed=$((failed + 1)); fi
          done < "$RUNNER_TEMP/images.txt"
          echo "failed=$failed" >> "$GITHUB_ENV"
          [ "$failed" -lt "$n" ]

      - name: Keep the scan results for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scans
          path: ${{ runner.temp }}/scans/*.json
          if-no-files-found: error
          retention-days: 3

      # The report's `platform` section (macOS and the container kernel; tools/platform_report.py).
      # Public sources only, read with curl and git; nothing is run from them. Each failure is a
      # warning, never a failed job: the publish job then keeps yesterday's copy of that section.
      - name: Fetch the platform sources
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -u
          src="$RUNNER_TEMP/platform-src"
          mkdir -p "$src/apple-notes" "$src/container-config"
          get() {  # get MAX_BYTES OUT URL [curl options]: HTTPS only, no redirects, size-capped
            max=$1 out=$2 url=$3; shift 3
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 300 \
              --max-filesize "$max" --output "$out" "$@" "$url" || { echo "::warning::could not fetch $url"; rm -f "$out"; }
          }
          openssl x509 -in main/tools/apple-root-ca.pem -outform DER > "$RUNNER_TEMP/apple-root.der"
          if echo "${APPLE_ROOT_CA_SHA256}  $RUNNER_TEMP/apple-root.der" | sha256sum --check --strict --quiet -; then
            get 4194304 "$src/gdmf-pmv.json" https://gdmf.apple.com/v2/pmv --cacert main/tools/apple-root-ca.pem
          else
            echo "::warning::tools/apple-root-ca.pem is not the pinned Apple Root CA; macOS versions not fetched"
          fi
          get 4194304 "$src/apple-security-releases.html" https://support.apple.com/en-us/100100
          if [ -f "$src/apple-security-releases.html" ]; then
            python3 main/tools/build_report.py platform-notes "$src/apple-security-releases.html" > "$RUNNER_TEMP/notes.txt" || : > "$RUNNER_TEMP/notes.txt"
            while IFS= read -r id; do
              case "$id" in *[!0-9]*|"") continue ;; esac
              get 4194304 "$src/apple-notes/$id.html" "https://support.apple.com/en-us/$id"
            done < "$RUNNER_TEMP/notes.txt"
          fi
          # Where /releases/latest redirects names apple/container's latest release; not followed.
          curl --silent --show-error --proto '=https' --tlsv1.2 --max-time 60 --output /dev/null \
            --write-out '%{redirect_url}' https://github.com/apple/container/releases/latest > "$src/container-latest.txt" || :
          git ls-remote --tags --refs https://github.com/apple/container.git > "$src/container-tags.txt" || rm -f "$src/container-tags.txt"
          if [ -f "$src/container-tags.txt" ]; then
            python3 main/tools/build_report.py platform-tags "$src/container-tags.txt" "$src/container-latest.txt" > "$RUNNER_TEMP/tags.txt" || : > "$RUNNER_TEMP/tags.txt"
            while IFS= read -r tag; do
              case "$tag" in *[!0-9.]*|"") continue ;; esac
              get 262144 "$src/container-config/$tag.swift" \
                "https://raw.githubusercontent.com/apple/container/$tag/Sources/ContainerPersistence/ContainerSystemConfig.swift"
            done < "$RUNNER_TEMP/tags.txt"
          fi
          get 314572800 "$src/osv-linux.zip" https://osv-vulnerabilities.storage.googleapis.com/Linux/all.zip
          mkdir -p "$RUNNER_TEMP/platform"
          python3 main/tools/build_report.py platform "$src" --out "$RUNNER_TEMP/platform/platform.json"

      - name: Keep the platform section for the publish job
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform
          path: ${{ runner.temp }}/platform/platform.json
          if-no-files-found: warn
          retention-days: 3

      - name: Fail if any image could not be scanned
        run: |
          [ "${failed}" = 0 ] || { echo "::error::${failed} image(s) were not scanned and are missing from the report"; exit 1; }

  publish:
    # Runs even when some images failed to scan: the rest are still worth publishing.
    needs: scan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The only job that can write, and only to the published branch.
    permissions:
      contents: write
    steps:
      - name: Check out the tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main
          persist-credentials: false

      - name: Check out the published branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: published
          path: published
          # Kept for the push below, and only in this directory; nothing from it is executed.
          persist-credentials: true

      - name: Fetch the scan results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scans
          path: ${{ runner.temp }}/scans

      # Absent if the scan job couldn't read the platform sources; yesterday's section is kept then.
      - name: Fetch the platform section
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform
          path: ${{ runner.temp }}/platform

      - name: Install the signing tool's one dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-virtualenv -r main/tools/requirements-sign.txt

      - name: Build report.json
        run: |
          set -o pipefail
          extra=()
          [ -f "$RUNNER_TEMP/platform/platform.json" ] && extra+=(--platform "$RUNNER_TEMP/platform/platform.json")
          [ -f published/report.json ] && extra+=(--previous published/report.json)
          python3 main/tools/build_report.py build published/library.json "$RUNNER_TEMP/scans" \
            --out "$RUNNER_TEMP/report.json" "${extra[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Sign report.json with the report key
        env:
          REPORT_SIGNING_KEY: ${{ secrets.REPORT_SIGNING_KEY }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" main/tools/sign_report.py "$RUNNER_TEMP/report.json"

      # A report that differs only in `generated` isn't worth a commit.
      - name: Commit report.json and report.json.sig to published
        run: |
          set -eu
          cd published
          if [ -f report.json ] && python3 ../main/tools/build_report.py same report.json "$RUNNER_TEMP/report.json"; then
            echo "Nothing changed except the date; not committing." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cp "$RUNNER_TEMP/report.json" "$RUNNER_TEMP/report.json.sig" .
          git add -- report.json report.json.sig
          # Only these two files, whatever else is in the tree.
          staged=$(git diff --cached --name-only | sort | tr '\n' ' ')
          case "$staged" in
            "report.json report.json.sig "|"report.json "|"report.json.sig ") ;;
            *) echo "::error::refusing to commit: staged $staged"; exit 1 ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Vulnerability report $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git push origin HEAD:published && exit 0
            git pull --rebase origin published
          done
          echo "::error::could not push to published"; exit 1
